# Integer to binary32 conversions (AMD RDNA 2 ISA guide 12.8, pages 138-139).
# SRC0 is an integer, so integer inline constants are read as their values;
# float inline constants stay outside the subset (rule vop1_vgpr). An inexact
# I32 or U32 result rounds by MODE.FP_ROUND[1:0], pinned to 0 (nearest even;
# guide 3.5, page 15, and 6.4, page 47); docs/shaders/vector-unary.md.

[[form]]
name = "V_CVT_F32_I32"
family = "VOP1"
opcode = 5
variant = "CvtF32I32"
operation = "cvt_f32"
signedness = "signed"
carry_in = "none"
width = 32
scc = "unchanged"
vcc = "unchanged"
exec = "unchanged"
wave = "wave32"
operands = "vop1_vgpr"
spec = [{ document = "guide", section = "12.8", page = 138 }]
verify = ["reference", "independent", "metal", "llvm_encoding"]

