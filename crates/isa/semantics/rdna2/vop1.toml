# Wave32 VOP1 integer, binary32 rounding and integer to binary32 conversion
# forms, AMD RDNA 2 ISA guide 12.8.

[operand_rules.vop1_vgpr]
family = "VOP1"
dst = { field = "VDST", class = "vgpr", min = 0, max = 255 }
src = [{ field = "SRC0", class = "vector_source" }]
max_literals = 1
unsupported = [
  "src_vcc_hi", "src_exec", "src_m0", "src_ttmp", "src_null", "src_float_inline", "src_special",
]

# Both operands are read and written by swap; SRC0 must select a VGPR.
[operand_rules.vop1_swap]
family = "VOP1"
dst = { field = "VDST", class = "vgpr", min = 0, max = 255 }
src = [{ field = "SRC0", class = "vgpr" }]
max_literals = 0
unsupported = [
  "src_sgpr", "src_vcc", "src_exec", "src_m0", "src_ttmp", "src_null", "src_inline",
  "src_float_inline", "src_special", "src_literal",
]

[[form]]
name = "V_NOT_B32"
family = "VOP1"
opcode = 55
variant = "NotB32"
operation = "not"
signedness = "bitwise"
carry_in = "none"
width = 32
scc = "unchanged"
vcc = "unchanged"
exec = "unchanged"
wave = "wave32"
operands = "vop1_vgpr"
spec = [{ document = "guide", section = "12.8", page = 143 }]
verify = ["reference", "independent", "metal", "llvm_encoding"]

