# ---- SOP1 32-bit EXEC-writing forms (#740) ----
# The ten SAVEEXEC forms save the previous EXEC_LO in the destination and then
# combine S0 with it; the two WREXEC forms write the combined result to both
# EXEC_LO and the destination. All twelve set SCC = (EXEC_LO != 0).
# Under Wave32 the upper half of EXEC is ignored (guide 3.3), so these forms
# touch EXEC_LO only. Guide 5.7 and 12.3, printed pages 36 and 120-122.

[operand_rules.sop1_saveexec]
family = "SOP1"
dst = { field = "SDST", class = "sgpr", min = 0, max = 105 }
src = [{ field = "SSRC0", class = "scalar_source" }]
max_literals = 1
unsupported = [
  "dst_vcc", "dst_exec", "dst_ttmp", "dst_m0", "dst_null",
  "src_vcc", "src_exec", "src_m0", "src_ttmp", "src_float_inline", "src_special",
]

[[form]]
name = "S_AND_SAVEEXEC_B32"
family = "SOP1"
opcode = 60
variant = "AndSaveExecB32"
operation = "and"
signedness = "bitwise"
carry_in = "none"
width = 32
scc = "nonzero"
vcc = "unchanged"
exec = "exec_save"
wave = "any"
operands = "sop1_saveexec"
spec = [
  { document = "guide", section = "12.3", page = 120 },
  { document = "guide", section = "5.7", page = 36 },
]
verify = ["reference", "independent", "metal", "llvm_encoding"]

