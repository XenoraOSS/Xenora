# ---- VOPC Wave32 binary32 compares (#786) ----
# VCC_LO := lanes where EXEC and the relation (S0 = SRC0 on the left) hold, as
# for the integer compares. Guide 12.9 Table 61 (pages 152-153), opcodes 0-15;
# the per-opcode table is used for U (true when either input is a NaN), not the
# summary table (docs/research/rdna2-errata.md). The N* forms negate LT..GE and
# hold on unordered inputs; TRU is relation "t". isNan is read as true for
# quiet and signalling NaNs alike. MODE pins input denormals allowed, so
# subnormals compare exactly; +0 and -0 compare equal. The contract is
# docs/shaders/vector-compare.md. v_cmpx, V_CMP_CLASS, VOP3 and Wave64 stay
# unsupported.
[operand_rules.vopc_vcc_f32]
family = "VOPC"
src = [
  { field = "SRC0", class = "vector_source" },
  { field = "VSRC1", class = "vgpr" },
]
# As vopc_vcc without integer inline constants (the vop1_f32 reading).
max_literals = 1
unsupported = [
  "src_vcc_hi", "src_exec", "src_m0", "src_ttmp", "src_null", "src_inline", "src_float_inline",
  "src_special",
]

