# VOP3 encodings of the gfx1030 semantic registry; included by ../rdna2.toml.
# Data only; see the root file for the field meanings.

# ---- Wave32 VOPC compares in VOP3A (#215) ----

# VDST encodes the scalar lane-mask destination, including vcc_lo (selector 106).
# The two sources are VGPRs. Modifiers are clear and SRC2 is inline zero.
[operand_rules.vop3_cmp_vgpr2]
family = "VOP3"
dst = { field = "VDST", class = "sgpr", min = 0, max = 106 }
src = [
  { field = "SRC0", class = "vgpr" },
  { field = "SRC1", class = "vgpr" },
]
max_literals = 0
variant_only = true
unsupported = [
  "dst_vcc_hi", "dst_exec", "dst_ttmp", "dst_m0", "dst_null",
  "src_sgpr", "src_vcc", "src_exec", "src_m0", "src_ttmp", "src_null", "src_inline",
  "src_float_inline", "src_special", "src_literal", "modifiers", "src2",
]

# VOPC binary32 compares in VOP3A (#976). The shared operand rule still
# describes the integer subset exactly; for these float forms the decoder
# accepts only the documented ABS/NEG input modifiers on SRC0/SRC1 and refuses
# CLAMP, OMOD, OP_SEL, SRC2 use and every non-VGPR source.

[[encoding_variant]]
of = "V_CMP_LT_F32"
family = "VOP3"
opcode = 1
operands = "vop3_cmp_vgpr2"
spec = [
  { document = "guide", section = "3.9", page = 19 },
  { document = "guide", section = "13.3.4", page = 257 },
]
verify = ["reference", "independent", "metal", "llvm_encoding"]

