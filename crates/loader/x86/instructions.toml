# The eight classic ALU operations share six opcodes at index*8 and one digit
# of the immediate groups 80, 81 and 83.
[alu]
operations = ["add", "or", "adc", "sbb", "and", "sub", "xor", "cmp"]

[[form]]
op = "movsxd"
opcode = 0x63
enc = "reg_rm"
size = "y"
src = "d"

[[form]]
op = "push"
opcode = 0x50
count = 8
enc = "op_reg"
size = "q"

[[form]]
