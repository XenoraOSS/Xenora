# Groups whose digits select an operation: [opcode, size, immediate, encoding].
[[group]]
map = "0f"
opcodes = [[0xBA, "v", "ib", "rm_imm"]]
digits = { 4 = "bt", 5 = "bts", 6 = "btr", 7 = "btc" }
lock = ["bts", "btr", "btc"]

[[group]]
opcodes = [[0xF6, "b", "", "rm"], [0xF7, "v", "", "rm"]]
digits = { 2 = "not", 3 = "neg", 4 = "mul", 5 = "imul", 6 = "div", 7 = "idiv" }
lock = ["not", "neg"]

[[group]]
opcodes = [[0xFE, "b", "", "rm"], [0xFF, "v", "", "rm"]]
digits = { 0 = "inc", 1 = "dec" }
lock = ["inc", "dec"]

[[group]]
opcodes = [[0xC0, "b", "ib", "rm_imm"], [0xC1, "v", "ib", "rm_imm"], [0xD0, "b", "", "rm_one"], [0xD1, "v", "", "rm_one"], [0xD2, "b", "", "rm_cl"], [0xD3, "v", "", "rm_cl"]]
digits = { 0 = "rol", 1 = "ror", 2 = "rcl", 3 = "rcr", 4 = "shl", 5 = "shr", 7 = "sar" }

# Double-precision shifts: the ModRM operand is shifted and filled from the
# reg operand, by an 8-bit immediate or by CL.
[[form]]
op = "shld"
map = "0f"
opcode = 0xA4
enc = "rm_reg_imm"
size = "v"
imm = "ub"

[[form]]
op = "shld"
map = "0f"
opcode = 0xA5
enc = "rm_reg_cl"
size = "v"

[[form]]
