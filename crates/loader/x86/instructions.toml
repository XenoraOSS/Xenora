stc = { writes = "cf", ref = "sdm STC" }
cmc = { reads = "cf", writes = "cf", ref = "sdm CMC" }
# AH holds SF, ZF, AF, PF and CF; valid in 64-bit mode when CPUID
# 8000_0001h ECX bit 0 is set.
lahf = { reads = "cf zf sf pf af", ref = "sdm LAHF" }
sahf = { writes = "cf zf sf pf af", ref = "sdm SAHF" }
cpuid = { ref = "sdm CPUID" }
cld = { ref = "sdm CLD" }
std = { ref = "sdm STD" }
fninit = { ref = "sdm FINIT/FNINIT" }
# A REP form repeats by leaving RIP on itself, so these end a translated block.
movs = { terminator = true, ref = "sdm MOVS/MOVSB/MOVSW/MOVSD/MOVSQ" }
stos = { terminator = true, ref = "sdm STOS/STOSB/STOSW/STOSD/STOSQ" }

