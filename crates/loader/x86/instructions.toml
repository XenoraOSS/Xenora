# Declarative registry of the x86-64 instruction forms Xenora decodes.
#
# Data only. crates/loader/generate_x86.py validates it against a closed
# vocabulary and writes crates/loader/src/x86_table.rs. Behaviour lives in
# reviewed Rust primitives (crates/loader/src/x86_exec.rs), never here.
# Independence: tests/x86_integer.rs never reads this file.
#
# A form names its opcode map ("1", "0f", "0f38" or "0f3a"), opcode byte, optional ModRM digit,
# operand encoding, operand size and immediate. Declaring a form makes it
# decodable; a form counts as implemented only once its operation has semantics
# and independent tests. Forms not listed here are rejected.
#
# enc = "string" is a string instruction: its source is [RSI], which FS or GS
# may override, its destination is [RDI], and it accepts the REP prefix (F3).
#
# lock = true accepts the LOCK prefix (F0) when the ModRM operand is memory. A
# group names the operations it accepts LOCK on, and the generator accepts it on
# every ALU operation but CMP. Every other use of LOCK is rejected, as the
# architecture's #UD.
#
# rm = N requires the ModRM r/m field to be N. It needs register_only, so the
# form matches exactly one ModRM byte. At most one form per opcode and digit.
#
# prefix is a mandatory prefix: "66", "f3" or "f2", "66" or "f2" in map 0f38 and "66" in map 0f3a. SSE forms use size x (XMM)
# and give the ModRM operand width in src: x = 16 bytes, q = 8, d = 4, w = 2.
# A 16-byte memory operand must be aligned unless unaligned = true.
#
# A [[vex]] entry is a VEX-encoded form. length is "128", "256" or "any" (VEX.L) and w
# is "0", "1" or "any" (VEX.W, the default). nds = true takes a
# further register from VEX.vvvv, which must otherwise be all ones: a source, or the
# destination of rm_imm_xmm. src is the memory
# width: v = the vector length. Operands may have any alignment unless aligned = true.
# Blends by a fourth register name it in bits 7:4 of their immediate.
#
# size: b = 8-bit, v = 16/32/64-bit by 0x66 and REX.W, q = 64-bit always,
#       y = 32/64-bit only, n = no operand. imm: ib = signed 8-bit,
#       iz = 16/32-bit sign-extended, iv = full operand size, iw = 16-bit,
#       rel8/rel32 = signed branch offset, moffs = 64-bit absolute address.
#
# enc = "acc_moffs" and "moffs_acc" take no ModRM: the operands are the
# accumulator and the memory at the moffs address, which FS or GS may override.
# They decode as reg_rm and rm_reg would.

schema = 1
architecture = "x86-64"

[documents]
sdm = "Intel 64 and IA-32 Architectures Software Developer's Manual, Volume 2"
apm = "AMD64 Architecture Programmer's Manual, Volume 3"

# Flag effects. "undefined" flags keep their previous value in Xenora, which is
# one permitted outcome and is never relied on by a test.
[operation]
add = { writes = "cf zf sf of pf af", ref = "sdm ADD" }
or = { writes = "cf zf sf of pf", undefined = "af", ref = "sdm OR" }
adc = { reads = "cf", writes = "cf zf sf of pf af", ref = "sdm ADC" }
sbb = { reads = "cf", writes = "cf zf sf of pf af", ref = "sdm SBB" }
and = { writes = "cf zf sf of pf", undefined = "af", ref = "sdm AND" }
sub = { writes = "cf zf sf of pf af", ref = "sdm SUB" }
xor = { writes = "cf zf sf of pf", undefined = "af", ref = "sdm XOR" }
cmp = { writes = "cf zf sf of pf af", ref = "sdm CMP" }
test = { writes = "cf zf sf of pf", undefined = "af", ref = "sdm TEST" }
inc = { writes = "zf sf of pf af", ref = "sdm INC" }
dec = { writes = "zf sf of pf af", ref = "sdm DEC" }
neg = { writes = "cf zf sf of pf af", ref = "sdm NEG" }
not = { ref = "sdm NOT" }
mov = { ref = "sdm MOV" }
movzx = { ref = "sdm MOVZX" }
movsx = { ref = "sdm MOVSX/MOVSXD" }
movsxd = { ref = "sdm MOVSX/MOVSXD" }
lea = { ref = "sdm LEA" }
xchg = { ref = "sdm XCHG" }
xadd = { writes = "cf zf sf of pf af", ref = "sdm XADD" }
cmpxchg = { writes = "cf zf sf of pf af", ref = "sdm CMPXCHG" }
bswap = { ref = "sdm BSWAP" }
cwde = { ref = "sdm CBW/CWDE/CDQE" }
cdq = { ref = "sdm CWD/CDQ/CQO" }
rol = { writes = "cf of", conditional = true, ref = "sdm RCL/RCR/ROL/ROR" }
ror = { writes = "cf of", conditional = true, ref = "sdm RCL/RCR/ROL/ROR" }
rcl = { reads = "cf", writes = "cf of", conditional = true, ref = "sdm RCL/RCR/ROL/ROR" }
rcr = { reads = "cf", writes = "cf of", conditional = true, ref = "sdm RCL/RCR/ROL/ROR" }
shl = { writes = "cf zf sf of pf", undefined = "af", conditional = true, ref = "sdm SAL/SAR/SHL/SHR" }
shr = { writes = "cf zf sf of pf", undefined = "af", conditional = true, ref = "sdm SAL/SAR/SHL/SHR" }
sar = { writes = "cf zf sf of pf", undefined = "af", conditional = true, ref = "sdm SAL/SAR/SHL/SHR" }
shld = { writes = "cf zf sf of pf", undefined = "af", conditional = true, ref = "sdm SHLD" }
shrd = { writes = "cf zf sf of pf", undefined = "af", conditional = true, ref = "sdm SHRD" }
mul = { writes = "cf of", undefined = "zf sf pf af", ref = "sdm MUL" }
imul = { writes = "cf of", undefined = "zf sf pf af", ref = "sdm IMUL" }
imul2 = { writes = "cf of", undefined = "zf sf pf af", ref = "sdm IMUL" }
div = { undefined = "cf zf sf of pf af", faults = true, ref = "sdm DIV" }
idiv = { undefined = "cf zf sf of pf af", faults = true, ref = "sdm IDIV" }
cmov = { reads = "cf zf sf of pf", ref = "sdm CMOVcc" }
setcc = { reads = "cf zf sf of pf", ref = "sdm SETcc" }
bt = { writes = "cf", undefined = "sf of pf af", ref = "sdm BT" }
