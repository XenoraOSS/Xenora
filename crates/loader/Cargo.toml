[package]
name = "xenora-loader"
description = "PE32+ loader, guest memory management, and x86-64 execution bootstrap for Xenora"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Runs the tests that need a native Metal device (scripts/test-gpu.sh); CI's virtual GPU lacks Apple family 7.
gpu-tests = []

[dependencies]
libc = "0.2"
sha2 = "0.10"
xenora-texture = { path = "../texture" }
xenora-xaudio2 = { path = "../xaudio2" }

[dev-dependencies]
xenora-metal = { path = "../metal" }
xenora-shader = { path = "../shader" }

[[bench]]
name = "dbt_bench"
harness = false

[[bench]]
name = "service_dispatch"
harness = false

[[bench]]
name = "mixed_workload"
harness = false
