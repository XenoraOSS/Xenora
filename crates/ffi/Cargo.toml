[package]
name = "xenora-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned C interface between the native macOS application and the Xenora runtime"

[lib]
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[features]
# Runs the tests that need a native Metal device (scripts/test-gpu.sh).
gpu-tests = []

[dependencies]
xenora-loader = { path = "../loader" }
xenora-metal = { path = "../metal" }
xenora-shader = { path = "../shader" }
xenora-texture = { path = "../texture" }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dev-dependencies]
objc2 = "=0.6.5"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLEvent", "MTLCommandBuffer", "MTLCommandQueue"] }
